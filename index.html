<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JF — Marriage Biodata</title>
  <meta name="description" content="Marriage biodata of Jannatul Ferdaues" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Loader -->
  <div class="loader" id="loader">
    <div class="loader-ring"></div>
    <div class="loader-mono" id="loaderMono">S</div>
  </div>

  <div class="progress" id="progress"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- Nav -->
  <header class="nav" id="nav">
    <a href="#home" class="nav-logo" id="navLogo">S</a>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
      <button class="icon-btn" id="printBtn" aria-label="Save as PDF" title="Save as PDF">⤓</button>
      <button class="icon-btn burger" id="burger" aria-label="Menu">☰</button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="home">
    <canvas id="petals"></canvas>
    <div class="hero-inner">
      <p class="invocation" id="invocation"></p>
      <div class="portrait" id="portrait">
        <div class="portrait-ring r1"></div>
        <div class="portrait-ring r2"></div>
        <div class="portrait-core" id="portraitCore"></div>
      </div>
      <p class="eyebrow">Marriage Biodata</p>
      <h1 class="hero-name" id="heroName"></h1>
      <p class="hero-roles"><span id="typed"></span><span class="caret">|</span></p>
      <div class="hero-cta">
        <a href="#about" class="btn primary">Get to know me</a>
        <a href="#contact" class="btn ghost">Contact family</a>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <a href="#about" class="scroll-hint" aria-label="Scroll down"><span></span></a>
  </section>

  <main id="sections"></main>

  <footer class="footer">
    <div class="divider"><span>✦</span></div>
    <p id="footerText"></p>
    <button class="btn ghost small" id="topBtn">Back to top ↑</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
